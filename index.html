<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Kalif-FSH | Fashion coaching & clothing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--gold:#C9A227;--caramel:#B9783F;--bg:#FBF5EA;--ink:#2A1A12;--card:#FFFFFF;--mute:#6f5a4c;--line:#e6d7bd;--dark:#2A1A12;--brand:#A5672F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d120c;--ink:#F6EBD6;--card:#2a1a12;--mute:#c4ad96;--line:#4a3426;--dark:#120a06;--brand:#8a5526}}
:root[data-theme="dark"]{--bg:#1d120c;--ink:#F6EBD6;--card:#2a1a12;--mute:#c4ad96;--line:#4a3426;--dark:#120a06;--brand:#8a5526}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;line-height:1.1;margin:0 0 .5rem}
h1{font-size:clamp(2.6rem,8vw,4.8rem);font-weight:700}h2{font-size:2.1rem}h3{font-size:1.35rem}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#FFF3D6}
nav .w{display:flex;align-items:center;gap:18px;height:58px;overflow-x:auto;white-space:nowrap}
nav a{text-decoration:none;font-weight:500;opacity:.85}nav a:hover,nav a.on{opacity:1;color:#fff;text-decoration:underline;text-underline-offset:6px}
.logo{font:700 1.5rem "Cormorant Garamond",serif;color:#fff;opacity:1;margin-right:auto}
.btn{background:var(--caramel);color:#fff;border:0;padding:11px 22px;border-radius:999px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:#8f5a2b}.btn.o{background:none;border:1.5px solid var(--caramel);color:var(--ink)}
.btn.s{padding:6px 14px;font-size:.9rem}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:var(--brand);color:#F6EBD6;padding:72px 0 64px;background-image:linear-gradient(115deg,transparent 60%,rgba(255,224,138,.18) 60%,rgba(42,26,18,.28) 100%)}
.hero p{max-width:34rem;font-size:1.15rem;opacity:.9}.hero h1 span{color:#FFE08A;font-style:italic}
section{padding:48px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}#lb{position:fixed;inset:0;z-index:20;background:rgba(20,10,5,.92);display:none;place-items:center;padding:16px;cursor:zoom-out}#lb.on{display:grid}#lb img{max-width:100%;max-height:92vh;border-radius:10px}#lb span{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;color:#fff;font-size:2rem;line-height:1}.tile{height:170px;overflow:hidden;display:grid;place-items:center;font:700 3.4rem "Cormorant Garamond",serif;color:rgba(255,255,255,.9);position:relative}
.card .b{padding:14px}.price{font-weight:600;color:var(--caramel)}.note{font-size:.88rem;color:var(--mute);font-style:italic}
.pick{position:absolute;top:10px;left:10px;background:var(--gold);color:#2A1A12;font:600 .75rem Jost;padding:2px 10px;border-radius:99px}
.heart{position:absolute;top:8px;right:10px;background:none;border:0;font-size:1.5rem;cursor:pointer;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1.5px solid var(--line);background:none;padding:6px 16px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--caramel);border-color:var(--caramel);color:#fff}
.look{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:20px}.look .sw{display:flex}.look .sw i{width:54px;height:54px;border-radius:50%;border:3px solid var(--card);margin-left:-14px}
.look .sw i:first-child{margin-left:0}.look>div:nth-child(2){flex:1;min-width:200px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:640px}
label{display:block;font-weight:500;margin:12px 0 4px}input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:none;cursor:pointer}
.opt:hover{border-color:var(--gold);background:rgba(201,162,39,.12)}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--card);border-left:1px solid var(--line);z-index:9;padding:20px;transform:translateX(105%);transition:transform .25s;overflow:auto}
#drawer.open{transform:none}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}.tbl th{color:var(--caramel)}
.scroll{overflow-x:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25D366;color:#fff;padding:12px 18px;border-radius:99px;text-decoration:none;font-weight:600;z-index:4}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--dark);color:var(--gold);padding:10px 20px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:10;pointer-events:none}
body.adm{--bg:#F2F2F0;--card:#fff;--ink:#1f2328;--mute:#5b6168;--line:#dcdcd8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body.adm{--bg:#14161a;--card:#1d2026;--ink:#e8e8e6;--mute:#9aa0a6;--line:#2c3036}}
body.adm nav,body.adm footer,body.adm .wa{display:none}
body.adm h1,body.adm h2,body.adm h3{font-family:inherit;font-weight:650}body.adm h2{font-size:1.5rem}body.adm h3{font-size:1.05rem}
body.adm .btn{background:#1f2328;color:#fff;border-radius:6px}body.adm .btn:hover{background:#C9A227;color:#1f2328}
body.adm .btn.o{background:none;color:var(--ink);border:1px solid var(--line)}body.adm .card,body.adm .panel,body.adm input,body.adm select,body.adm textarea{border-radius:6px}
body.adm .tbl th{color:var(--mute);font-weight:600}body.adm .price,body.adm .tbl th{color:var(--mute)}
.ad{display:flex;min-height:100vh}.side{width:220px;flex:none;background:#1f2328;color:#e8e8e6;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.side .al{font-weight:700;font-size:1.1rem;color:#C9A227;margin-bottom:18px}.side .si,.side a{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:.95rem}
.side .si:hover,.side a:hover{background:#2c3238}.side .si.on{background:#C9A227;color:#1f2328;font-weight:600}.side .sp{flex:1}
.amain{flex:1;padding:24px;min-width:0}.alogin{display:grid;place-items:center;min-height:100vh;padding:20px}
@media(max-width:700px){.ad{flex-direction:column}.side{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side .al{width:100%;margin-bottom:6px}.side .sp{display:none}}
footer{background:var(--brand);color:#FFF3D6;padding:32px 0;text-align:center}.quote{border-left:4px solid var(--gold);padding-left:16px}
</style></head><body>
<nav><div class="w"><a class="logo" href="#/">Kalif-FSH</a><a href="#/looks">Shop the Look</a><a href="#/book">Book a session</a><a href="#" id="cartb">Bag (<span id="cc">0</span>)</a></div></nav>
<main id="app"></main>
<aside id="drawer" aria-label="Shopping bag"></aside><div id="toast"></div><div id="lb" role="dialog" aria-label="Photo viewer"><span aria-hidden="true">×</span><img alt=""></div>
<a class="wa" href="https://wa.me/2348143196891?text=Hi%20Kalif-FSH" target="_blank" rel="noopener">WhatsApp us</a>
<footer><div class="w">Kalif-FSH. Dress with intention. Call or WhatsApp <a href="tel:+2348143196891">+234 814 319 6891</a></div></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=(k,d,st)=>{try{const v=(st||localStorage).getItem('kfsh_'+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v,st)=>{try{(st||localStorage).setItem('kfsh_'+k,JSON.stringify(v))}catch(e){}};
const N=n=>'₦'+Number(n).toLocaleString();
const ST={products:[],reviews:[]};
let cart=ld('cart',[]),wish=ld('wish',[]),admin=!!ld('cred',null,sessionStorage),filt='All',qz={a:[]},AD={reviews:[]};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,3000)};
const wa=t=>window.open('https://wa.me/2348143196891?text='+encodeURIComponent(t),'_blank');
const api=async(p,body)=>{try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();return r.ok?j:{error:j.error||'Request failed'}}catch(e){return{error:'Network error'}}};
const adm=(action,x)=>api('/api/admin',{...ld('cred',{},sessionStorage),action,...x});
const saveP=async()=>{const r=await adm('save',{file:'products',data:ST.products});toast(r.error||'Saved. It goes live on the site in about a minute.')};
async function loadPublic(){try{const[p,r]=await Promise.all([fetch('data/products.json',{cache:'no-store'}).then(x=>x.json()),fetch('data/reviews.json',{cache:'no-store'}).then(x=>x.json())]);ST.products=p;ST.reviews=r}catch(e){}}
async function load(){const j=await adm('pending',{});if(j.error){if(/password/i.test(j.error)){admin=false;sv('cred',null,sessionStorage)}else toast(j.error)}AD.reviews=j.pending||[]}
(async()=>{await loadPublic();if(admin)await load();render();upd()})();
const toB64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(b)});
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};i.onerror=no;i.src=URL.createObjectURL(f)});
const prod=id=>ST.products.find(x=>x.id==id);
const add=id=>{cart.push(id);sv('cart',cart);upd();toast('Added to bag')};
const upd=()=>{$('#cc').textContent=cart.length;drawer()};
const card=p=>`<article class="card"><div class="tile" style="background:#B9783F">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.n)}" data-z="${esc(p.img)}" tabindex="0">`:esc(p.n[0])}${p.pick?'<span class="pick">Coach’s pick</span>':''}<button class="heart" data-w="${p.id}" aria-label="Wishlist">${wish.includes(p.id)?'♥':'♡'}</button></div><div class="b"><h3>${esc(p.n)}</h3><div class="price">${N(p.p)}</div>${p.note?`<p class="note">“${esc(p.note)}”</p>`:''}${p.fit?`<p class="note">Fit: ${esc(p.fit)}</p>`:''}<button class="btn s" data-a="${p.id}">Add to bag</button></div></article>`;
const drawer=()=>{const t=cart.reduce((s,i)=>s+(prod(i)?.p||0),0);$('#drawer').innerHTML=`<div class="row"><h3>Your bag</h3><button class="btn o s" id="x">Close</button></div>`+(cart.length?cart.map((i,k)=>`<div class="row"><span>${esc(prod(i)?.n||'Item')}</span><span>${N(prod(i)?.p||0)} <button class="btn o s" data-r="${k}">×</button></span></div>`).join('')+`<div class="row"><b>Total</b><b>${N(t)}</b></div><label>Name</label><input id="cn"><label>Phone / WhatsApp</label><input id="cp"><p class="note">Your order opens in WhatsApp so Kalif can confirm payment and delivery with you.</p><button class="btn" id="co">Send order</button>`:'<p>Your bag is empty. Browse the shop or take the style quiz to find pieces.</p>')};
const empty='<p>New pieces are on the way. Check back soon, or WhatsApp Kalif on +234 814 319 6891.</p>';
const rev=r=>`<p class="quote">“${esc(r.t)}”<br><b>${esc(r.n)}</b></p>`;
const V={
home(){const top=ST.products.filter(p=>p.pick).slice(0,4);return`<div class="hero"><div class="w"><h1>Dress like you<br>mean <span>it.</span></h1><p>Kalif-FSH pairs a curated clothing line with one-on-one fashion coaching. Shop pieces picked by your stylist, or book a session and build a wardrobe that fits your life.</p><p><a class="btn" href="#/quiz">Find my style</a> <a class="btn o" style="color:#F6EBD6" href="#/book">Book a session</a></p></div></div>
<section><div class="w"><h2>Coach’s picks</h2><p class="note">Every piece comes with styling notes from Kalif.</p>${top.length?`<div class="grid">${top.map(card).join('')}</div>`:empty}</div></section>
<section style="background:var(--card)"><div class="w"><h2>Kind words</h2>${ST.reviews.length?`<div class="grid">${ST.reviews.map(rev).join('')}</div>`:'<p>No reviews yet. Worked with Kalif or bought a piece? Be the first to say so.</p>'}<form id="rf" class="panel" style="margin-top:24px"><h3>Leave kind words</h3><label>Your name</label><input id="rn" required maxlength="40"><label>Your message</label><textarea id="rt" rows="3" required maxlength="400"></textarea><br><br><button class="btn">Send review</button><p class="note">Kalif reads every message before it appears on the page.</p></form></div></section>`},
shop(){const cats=['All',...new Set(ST.products.map(p=>p.c))];return`<section><div class="w"><h2>Shop</h2><div class="chips">${cats.map(c=>`<button class="chip ${c==filt?'on':''}" data-f="${esc(c)}">${esc(c)}</button>`).join('')}<button class="chip ${filt=='♥'?'on':''}" data-f="♥">Wishlist (${wish.length})</button></div>${ST.products.length?`<div class="grid">${ST.products.filter(p=>filt=='All'||(filt=='♥'?wish.includes(p.id):p.c==filt)).map(card).join('')||'<p>Nothing here yet. Tap the heart on any piece to save it.</p>'}</div>`:empty}</div></section>`},
looks(){const g={};ST.products.filter(p=>p.look).forEach(p=>(g[p.look]=g[p.look]||[]).push(p));const ks=Object.keys(g);return`<section><div class="w"><h2>Shop the look</h2><p class="note">A full outfit, added to your bag in one tap.</p>${ks.length?ks.map(k=>`<div class="card look"><div class="sw">${g[k].map(p=>p.img?`<i style="background:url('${esc(p.img)}') center/cover"></i>`:`<i style="background:#B9783F"></i>`).join('')}</div><div><h3>${esc(k)}</h3><p class="note">${g[k].map(p=>esc(p.n)).join(', ')}.</p></div><div><div class="price">${N(g[k].reduce((s,p)=>s+p.p,0))}</div><button class="btn s" data-l="${esc(k)}">Add full look</button></div></div><br>`).join(''):'<p>Looks will appear here once Kalif puts outfits together.</p>'}</div></section>`},
quiz(){const Q=[['What’s your style vibe?',[['Polished and classic'],['Bold and eye-catching'],['Easy and relaxed']]],['What are you dressing for?',[['Work'],['Events'],['Everyday']]],['Your budget per piece?',[['Under ₦35,000'],['Up to ₦60,000'],['No limit']]]];const s=qz.a.length;if(s<3){const[q,o]=Q[s];return`<section><div class="w"><div class="panel"><p class="note">Question ${s+1} of 3</p><h2>${q}</h2>${o.map((x,i)=>`<button class="opt" data-q="${i}">${x[0]}</button>`).join('')}</div></div></section>`}
const vibe=qz.a[0],bud=qz.a[2];const rec=ST.products.filter(p=>p.v==vibe&&p.p<=bud);const nm={classic:'The Tailored Classic',bold:'The Gold Statement',relaxed:'The Effortless Neutral'}[vibe];
return`<section><div class="w"><div class="panel"><h2>You’re ${nm}</h2><p>Book a session and Kalif will turn this into a full plan.</p>${rec.length?`<div class="grid">${rec.slice(0,3).map(card).join('')}</div>`:'<p>No pieces match yet. Kalif is adding new styles, so check back soon.</p>'}<form id="lf"><label>Email me my style profile</label><input id="le" type="email" required placeholder="you@email.com"><br><br><button class="btn">Send my profile</button> <button type="button" class="btn o" id="rq">Retake quiz</button></form></div></div></section>`},
book(){return`<section><div class="w"><div class="panel"><h2>Book a session</h2><form id="bf"><label>Package</label><select id="bp"><option>1:1 styling session (60 min)</option><option>Wardrobe audit</option><option>Event styling</option></select><label>Name</label><input id="bn" required><label>Phone / WhatsApp</label><input id="bt" required><label>Preferred date</label><input id="bd" type="date" required><label>Time</label><select id="bh"><option>10:00</option><option>13:00</option><option>16:00</option></select><label>Anything Kalif should know?</label><textarea id="bm" rows="3"></textarea><br><br><button class="btn">Request booking</button><p class="note">Your request opens in WhatsApp so Kalif can confirm the slot and price.</p></form></div></div></section>`},
admin(){if(!admin)return`<section class="alogin"><div class="panel" style="width:100%"><h2>Kalif-FSH admin</h2><p class="note">Sign in to manage products and reviews.</p><form id="af"><label>Username</label><input id="au" autocomplete="username" required><label>Password</label><input id="ap" type="password" autocomplete="current-password" required><br><br><button class="btn">Log in</button> <a href="#/">Back to store</a></form></div></section>`;
const tab=window._tab||'Products';const tb=['Products','Reviews'].map(t=>`<button class="si ${t==tab?'on':''}" data-t="${t}">${t}</button>`).join('');let b='';
const tbl=(h,rows)=>`<div class="scroll"><table class="tbl"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows}</table></div>`;
if(tab=='Products')b=`<form id="pf" class="panel" style="max-width:none"><h3>Add product</h3><div class="grid"><div><label>Name</label><input id="pn" required></div><div><label>Category</label><input id="pc" required placeholder="Tops, Dresses…"></div><div><label>Price (₦)</label><input id="pp" type="number" required></div><div><label>Style vibe</label><select id="pv"><option value="classic">Classic</option><option value="bold">Bold</option><option value="relaxed">Relaxed</option></select></div><div><label>Outfit name (optional)</label><input id="pl" placeholder="Groups pieces into a look"></div><div><label>Photo</label><input id="pi" type="file" accept="image/*"></div></div><label>Coach’s styling note</label><input id="pm"><label>Fit note</label><input id="pt"><br><br><button class="btn s">Upload product</button></form><br>${ST.products.length?tbl(['Photo','Name','Category','Price','Pick',''],ST.products.map(p=>`<tr><td>${p.img?`<img src="${esc(p.img)}" alt="" width="44" height="44" style="object-fit:cover;border-radius:6px">`:'–'}</td><td>${esc(p.n)}</td><td>${esc(p.c)}</td><td>${N(p.p)}</td><td><input type="checkbox" data-k="${p.id}" ${p.pick?'checked':''} style="width:auto"></td><td><button class="btn o s" data-d="${p.id}">Delete</button></td></tr>`).join('')):'<p>No products yet. Use the form above to upload your first piece.</p>'}`;
else b=`<h3>Waiting for approval</h3>${AD.reviews.length?tbl(['Name','Message',''],AD.reviews.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.t)}</td><td><button class="btn s" data-ap="${r.id}">Approve</button> <button class="btn o s" data-rd="${r.id}">Delete</button></td></tr>`).join('')):'<p>No new reviews.</p>'}<h3 style="margin-top:24px">On the site</h3>${ST.reviews.length?tbl(['Name','Message',''],ST.reviews.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.t)}</td><td><button class="btn o s" data-rm="${r.id}">Remove</button></td></tr>`).join('')):'<p>Nothing published yet.</p>'}`;
return`<div class="ad"><aside class="side"><div class="al">Kalif-FSH admin</div>${tb}<div class="sp"></div><a href="#/">View storefront</a><button class="si" id="lo">Log out</button></aside><div class="amain"><h2>${tab}</h2>${b}</div></div>`}};
function render(){const h=(location.hash.replace('#/','')||'home').split('?')[0];document.body.classList.toggle('adm',h=='admin');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+h));$('#app').innerHTML=(V[h]||V.home)();scrollTo(0,0)}
document.addEventListener('click',async e=>{const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
if(t.id=='cartb'){e.preventDefault();$('#drawer').classList.add('open')}
if(t.id=='x')$('#drawer').classList.remove('open');
if(d.a)add(+d.a);if(d.r){cart.splice(+d.r,1);sv('cart',cart);upd()}
if(d.w){const i=+d.w;wish=wish.includes(i)?wish.filter(x=>x!=i):[...wish,i];sv('wish',wish);render()}
if(d.f){filt=d.f;render()}
if(d.l)ST.products.filter(p=>p.look==d.l).forEach(p=>add(p.id));
if(d.q!==undefined){qz.a.push([['classic','bold','relaxed'],['w','e','d'],[35000,60000,1e9]][qz.a.length][+d.q]);render()}
if(t.id=='rq'){qz.a=[];render()}
if(d.t){window._tab=d.t;await load();render()}
if(d.d&&confirm('Delete this product?')){ST.products=ST.products.filter(p=>p.id!=d.d);render();await saveP()}
if(d.ap){const r=AD.reviews.find(x=>x.id==d.ap);if(r){ST.reviews.unshift(r);AD.reviews=AD.reviews.filter(x=>x.id!=r.id);render()}const j=await adm('approve',{id:d.ap});toast(j.error||'Published. Live in about a minute.')}
if(d.rd&&confirm('Delete this review?')){AD.reviews=AD.reviews.filter(x=>x.id!=d.rd);render();await adm('drop',{id:d.rd})}
if(d.rm&&confirm('Remove this review from the site?')){ST.reviews=ST.reviews.filter(x=>x.id!=d.rm);render();const j=await adm('save',{file:'reviews',data:ST.reviews});toast(j.error||'Removed. Live in about a minute.')}
if(t.id=='lo'){admin=false;sv('cred',null,sessionStorage);render()}
if(t.id=='co'){const n=$('#cn').value.trim(),ph=$('#cp').value.trim();if(!n||!ph)return toast('Enter your name and phone');const it=cart.map(i=>prod(i)?.n).join(', ');const tot=cart.reduce((s,i)=>s+(prod(i)?.p||0),0);wa(`Hi Kalif-FSH, I’d like to order: ${it}. Total ${N(tot)}. Name: ${n}. Phone: ${ph}.`);cart=[];sv('cart',cart);upd();$('#drawer').classList.remove('open')}});
document.addEventListener('change',async e=>{const d=e.target.dataset;if(d.k){ST.products.find(p=>p.id==d.k).pick=e.target.checked?1:0;await saveP()}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.id,g=i=>$('#'+i).value.trim();
if(f=='af'){const c={user:g('au'),pass:$('#ap').value};const r=await api('/api/admin',{...c,action:'login'});if(r.error)return toast(r.error);sv('cred',c,sessionStorage);admin=true;await load();render()}
if(f=='pf'){let img='';const fl=$('#pi').files[0];if(fl){toast('Uploading photo…');const u=await adm('upload',{base64:await toB64(await shrink(fl))});if(u.error)return toast(u.error);img=u.url}
ST.products.unshift({id:Date.now(),n:g('pn'),c:g('pc'),p:+g('pp'),v:g('pv'),look:g('pl'),note:g('pm'),fit:g('pt'),img,pick:0});render();await saveP()}
if(f=='bf'){const o={n:g('bn'),t:g('bt'),p:g('bp'),d:g('bd'),h:g('bh'),m:g('bm')};wa(`Hi Kalif-FSH, I’d like to book: ${o.p} on ${o.d} at ${o.h}. Name: ${o.n}. Phone: ${o.t}. ${o.m}`);e.target.reset()}
if(f=='lf'){const st={classic:'Tailored Classic',bold:'Gold Statement',relaxed:'Effortless Neutral'}[qz.a[0]];wa(`Hi Kalif-FSH, my style profile is ${st}. Please email me at ${g('le')}.`)}
if(f=='rf'){const r=await api('/api/review',{n:g('rn'),t:g('rt')});if(r.error)toast('Could not send. Please try again.');else{toast('Thank you! Kalif will review it shortly.');e.target.reset()}}});
const zoom=u=>{$('#lb img').src=u;$('#lb').classList.add('on')},unzoom=()=>$('#lb').classList.remove('on');
document.addEventListener('click',e=>{const i=e.target.closest('img[data-z]');if(i)zoom(i.dataset.z);else if(e.target.closest('#lb'))unzoom()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')unzoom();if(e.key=='Enter'&&e.target.dataset?.z)zoom(e.target.dataset.z)});
addEventListener('hashchange',render);upd();render();
</script></body></html>
